# Provider network interface, e.g. eth3
ISP_INTERFACE="ppp0"

# Startup arguments
NFQWS_BASE_ARGS="--lua-init=@/opt/etc/nfqws2/lua/zapret-lib.lua \
                 --lua-init=@/opt/etc/nfqws2/lua/zapret-antidpi.lua \
                 --lua-init=@/opt/etc/nfqws2/lua/zapret-auto.lua \
                 --blob=quic_initial:@/opt/etc/nfqws2/blobs/quic_initial.bin \
                 --blob=quic_google:@/opt/etc/nfqws2/blobs/quic_initial_www_google_com.bin \
                 --blob=tls_clienthello:@/opt/etc/nfqws2/blobs/tls_clienthello.bin \
                 --blob=tls_google:@/opt/etc/nfqws2/blobs/tls_clienthello_www_google_com.bin \
                 --blob=tls_max:@/opt/etc/nfqws2/blobs/tls_clienthello_max_ru.bin \
                 --blob=stun:@/opt/etc/nfqws2/blobs/stun.bin \
                 --blob=active_discord_udp:@/opt/etc/nfqws2/blobs/discord_udp.bin"

# HTTP(S) strategy (Torrents & General Anti-DPI: fake stun + fake tls_google + fakedsplit)
NFQWS_ARGS="--filter-tcp=80,443,1984,2053,2083,2087,2096,5222,8443 --filter-l7=http,tls,mtproto \
            --payload=tls_client_hello \
            --lua-desync=fake:blob=stun:tcp_ts=-600000:repeats=6 \
            --lua-desync=fake:blob=tls_google:tcp_ts=-600000:repeats=6 \
            --lua-desync=fakedsplit:pattern=0x00:tcp_ts=-600000:repeats=6 \
            --payload=http_req \
            --lua-desync=fake:blob=tls_max:tcp_ts=-600000:repeats=6 \
            --lua-desync=fakedsplit:pattern=0x00:tcp_ts=-600000:repeats=6"

# QUIC strategy (disabled to force TCP 443 HTTPS fallback for phones)
NFQWS_ARGS_QUIC=""

# UDP strategy
NFQWS_ARGS_UDP="--filter-udp=590-600,1400,3478-3481,5349,19294-19344,49152-65535 \
                --filter-l7=wireguard,stun,discord,mtproto,unknown \
                --out-range=<n2 \
                --payload=wireguard_initiation,wireguard_response,wireguard_cookie,stun,discord_ip_discovery,mtproto_initial,unknown \
                --lua-desync=fake:blob=active_discord_udp:repeats=6"

# Working modes
MODE_LIST="--hostlist=/opt/etc/nfqws2/lists/user.list"
MODE_ALL="--hostlist-exclude=/opt/etc/nfqws2/lists/exclude.list"
MODE_AUTO="$MODE_LIST --hostlist-auto=/opt/etc/nfqws2/lists/auto.list --hostlist-auto-debug=/opt/var/log/nfqws2.log $MODE_ALL"

NFQWS_EXTRA_ARGS="$MODE_AUTO"

NFQWS_ARGS_IPSET="--ipset=/opt/etc/nfqws2/lists/ipset.list --ipset-exclude=/opt/etc/nfqws2/lists/ipset_exclude.list"

# Custom arguments (Discord media & Google/YouTube fast profile)
NFQWS_ARGS_CUSTOM="--filter-tcp=2053,2083,2087,2096,8443 --filter-l7=tls \
                 --hostlist-domains=discord.media \
                 --payload=tls_client_hello \
                 --lua-desync=fake:blob=tls_google:tcp_ts=-600000:repeats=6 \
                 --lua-desync=fakedsplit:pattern=0x00:tcp_ts=-600000:repeats=6"

IPV6_ENABLED=1

TCP_PORTS=80,443,1984,2053,2083,2087,2096,5222,8443
UDP_PORTS=590:600,1400,3478:3481,5349,19294:19344,49152:65535

POLICY_NAME="nfqws"
POLICY_EXCLUDE=0

LOG_LEVEL=0
LOG_DEBUG_PATH="@/opt/var/log/nfqws2-debug.log"

NFQUEUE_NUM=300
USER=nobody
CONFIG_VERSION=1